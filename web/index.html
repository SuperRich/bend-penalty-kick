<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Bend Penalty Kick</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Bend Penalty Kick</h1>
      <p class="score" id="score">YOU 0 - 0 AI</p>
      <p class="kicks" id="kicks">Best of 5 · you shoot</p>
    </header>
    <div class="stage">
      <canvas id="pitch"></canvas>
      <p class="flash" id="flash" hidden></p>
    </div>
    <p class="status" id="status">Click the pitch to start sound. Then aim and shoot.</p>
    <button id="again" type="button" hidden>Play again</button>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
